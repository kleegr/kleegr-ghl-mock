name: CI

# Catch install / build / route regressions in GitHub before they reach Vercel.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: install · build · smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (clean, from lockfile)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test (routes + SPA rewrite)
        run: npm run smoke
